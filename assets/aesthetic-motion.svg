<svg width="1100" height="92" viewBox="0 0 1100 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="80" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#4f46e5"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="0.82" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulse { 0%,100% { opacity:.34; } 50% { opacity:1; } }
      @keyframes slide { 0% { transform: translateX(-220px); opacity:0; } 18%,78% { opacity:1; } 100% { transform: translateX(220px); opacity:0; } }
      .glow { animation:pulse 3.6s ease-in-out infinite; }
      .dot { animation:slide 5.6s ease-in-out infinite; }
      .t1 { animation:pulse 4.4s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1100" height="92" rx="18" fill="#050505" fill-opacity="0"/>
  <line class="glow" x1="90" y1="66" x2="1010" y2="66" stroke="url(#line)" stroke-width="2"/>
  <circle class="dot" cx="550" cy="66" r="5" fill="#c4b5fd"/>
  <text class="t1" x="550" y="33" text-anchor="middle" fill="#dbeafe" font-size="18" font-family="Inter, ui-sans-serif, system-ui" font-weight="650">Turning visual taste into reproducible AI systems · 把审美判断沉淀为可复现的 AI 系统</text>
</svg>
