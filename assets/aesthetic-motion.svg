<svg width="1100" height="76" viewBox="0 0 1100 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="80" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#4f46e5"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="0.82" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulse { 0%,100% { opacity:.62; } 50% { opacity:1; } }
      @keyframes slide { 0% { transform: translateX(-260px); opacity:0; } 18%,78% { opacity:1; } 100% { transform: translateX(260px); opacity:0; } }
      .glow { animation:pulse 3.6s ease-in-out infinite; }
      .dot { animation:slide 5.6s ease-in-out infinite; }
      .t1 { animation:pulse 4.4s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="118" y="6" width="864" height="54" rx="27" fill="#f8fafc" fill-opacity="0.72"/>
  <rect x="118.5" y="6.5" width="863" height="53" rx="26.5" stroke="#e5e7eb" stroke-opacity="0.85"/>
  <text class="t1" x="550" y="31" text-anchor="middle" fill="#334155" font-size="17" font-family="Inter, ui-sans-serif, system-ui" font-weight="680">Turning visual taste into reproducible AI systems</text>
  <text class="t1" x="550" y="51" text-anchor="middle" fill="#64748b" font-size="14" font-family="Inter, ui-sans-serif, system-ui" font-weight="560">把审美判断沉淀为可复现的 AI 系统</text>
  <line class="glow" x1="170" y1="66" x2="930" y2="66" stroke="url(#line)" stroke-width="2"/>
  <circle class="dot" cx="550" cy="66" r="4" fill="#8b5cf6"/>
</svg>
