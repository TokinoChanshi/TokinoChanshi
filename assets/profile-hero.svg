<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.38" stop-color="#111827"/>
      <stop offset="0.72" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <style>
      @keyframes driftA { 0%,100% { transform: translate(0,0) scale(1); opacity:.36;} 50% { transform: translate(58px,-16px) scale(1.1); opacity:.68;} }
      @keyframes driftB { 0%,100% { transform: translate(0,0) scale(1); opacity:.22;} 50% { transform: translate(-48px,22px) scale(1.08); opacity:.5;} }
      @keyframes fadeUp { 0% { opacity:0; transform: translateY(14px);} 100% { opacity:1; transform: translateY(0);} }
      @keyframes lineGlow { 0%,100% { opacity:.28;} 50% { opacity:.85;} }
      .orbA { animation: driftA 7s ease-in-out infinite; transform-origin: center; }
      .orbB { animation: driftB 9s ease-in-out infinite; transform-origin: center; }
      .title { animation: fadeUp 1.1s ease-out both; }
      .sub { animation: fadeUp 1.1s ease-out .22s both; }
      .meta { animation: fadeUp 1.1s ease-out .42s both; }
      .line { animation: lineGlow 3.8s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="26" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle class="orbA" cx="830" cy="72" r="118" fill="url(#orb)"/>
    <circle class="orbB" cx="340" cy="215" r="150" fill="url(#orb)"/>
  </g>
  <path d="M0 202C188 171 324 225 520 201C728 176 850 168 1200 199V260H0V202Z" fill="white" fill-opacity="0.10"/>
  <path d="M0 226C210 195 356 236 545 220C760 202 940 201 1200 226V260H0V226Z" fill="white" fill-opacity="0.14"/>
  <rect class="line" x="330" y="206" width="540" height="2" rx="1" fill="#e9d5ff" fill-opacity="0.66"/>
  <g text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text class="title" x="600" y="94" fill="#ffffff" font-size="52" font-weight="820" letter-spacing="-1.2">TokinoChanshi</text>
    <text class="sub" x="600" y="136" fill="#f8fafc" font-size="22" font-weight="650">AI Application Builder · Multimodal Infrastructure · Aesthetic Systems</text>
    <text class="meta" x="600" y="171" fill="#e9d5ff" font-size="16" font-weight="500">时野禅师 · 高美学背景 × 工作流工程 × 产品系统</text>
  </g>
</svg>
