<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.42" stop-color="#111827"/>
      <stop offset="0.72" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <style>
      @keyframes driftA { 0%,100% { transform: translate(0,0) scale(1); opacity:.42;} 50% { transform: translate(70px,-22px) scale(1.12); opacity:.72;} }
      @keyframes driftB { 0%,100% { transform: translate(0,0) scale(1); opacity:.28;} 50% { transform: translate(-60px,28px) scale(1.08); opacity:.55;} }
      @keyframes fadeUp { 0% { opacity:0; transform: translateY(18px);} 100% { opacity:1; transform: translateY(0);} }
      .orbA { animation: driftA 7s ease-in-out infinite; transform-origin: center; }
      .orbB { animation: driftB 9s ease-in-out infinite; transform-origin: center; }
      .title { animation: fadeUp 1.2s ease-out both; }
      .sub { animation: fadeUp 1.2s ease-out .25s both; }
      .meta { animation: fadeUp 1.2s ease-out .45s both; }
    </style>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle class="orbA" cx="820" cy="95" r="150" fill="url(#orb)"/>
    <circle class="orbB" cx="360" cy="270" r="190" fill="url(#orb)"/>
  </g>
  <path d="M0 286C178 250 310 312 512 285C724 256 856 239 1200 278V360H0V286Z" fill="white" fill-opacity="0.13"/>
  <path d="M0 313C195 275 354 324 545 305C756 284 937 282 1200 313V360H0V313Z" fill="white" fill-opacity="0.18"/>
  <g text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text class="title" x="600" y="142" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-1.6">TokinoChanshi</text>
    <text class="sub" x="600" y="190" fill="#f8fafc" font-size="25" font-weight="650">AI Application Builder · Multimodal Infrastructure · Aesthetic Systems</text>
    <text class="meta" x="600" y="234" fill="#e9d5ff" font-size="17" font-weight="500">时野禅师 · 高美学背景 × 工作流工程 × 产品系统</text>
  </g>
</svg>
