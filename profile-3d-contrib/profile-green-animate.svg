      <stop offset="0.45" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      @keyframes lift { 0%,100% { transform: translateY(0); opacity:.5; } 50% { transform: translateY(-18px); opacity:1; } }
      @keyframes sweep { 0% { transform: translateX(-260px); opacity:0; } 20%,80% { opacity:1; } 100% { transform: translateX(260px); opacity:0; } }
