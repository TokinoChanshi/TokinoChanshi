      .bar3 { animation: lift 3.2s ease-in-out .5s infinite; }
      .bar4 { animation: lift 3.2s ease-in-out .75s infinite; }
      .sweep { animation: sweep 5s ease-in-out infinite; }
    </style>
  </defs>
